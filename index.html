<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050609">
  <title>SPIN OUT — 회전 물리 서바이벌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span>SPIN OUT</div>
      <div class="hud-stats">
        <div class="coin-counter" aria-label="수집한 코인">◉ <strong id="coinCount">0</strong></div>
        <div class="counter"><span>참가</span><strong id="remaining">21</strong><span>/ 21</span></div>
      </div>
    </header>

    <section id="arena" class="arena" aria-label="회전 물리 게임 영역">
      <canvas id="gameCanvas"></canvas>
      <div class="round-info">
        <span id="coinCountdown">코인까지 10초</span>
        <span id="jumpStatus" class="jump-status ready">SPACE · READY</span>
        <span id="timer">00:00</span>
      </div>
      <div id="toast" class="toast" aria-live="polite"></div>

      <div id="startScreen" class="overlay visible">
        <div class="eyebrow">PHYSICS SURVIVAL</div>
        <h1>끝까지<br><em>회전하라</em></h1>
        <p>20명의 AI와 넓어진 경기장에서 점프 회피!<br>10초마다 나타나는 코인을 모으세요.</p>
        <button id="startButton" class="primary-button">게임 시작 <span>↗</span></button>
        <div class="gesture-hint"><span class="key-icon">W</span> 이동 · <span class="space-key">SPACE</span> 점프</div>
      </div>

      <div id="resultScreen" class="overlay result-screen">
        <div class="eyebrow">LAST ONE SPINNING</div>
        <div id="winnerFace" class="winner-face"></div>
        <h2 id="winnerName">승리!</h2>
        <p id="resultText">마지막까지 살아남았습니다.</p>
        <button id="againButton" class="primary-button">다시 플레이 <span>↻</span></button>
      </div>
    </section>

    <footer class="controls">
      <button id="restartButton" class="ghost-button" type="button">↻ <span>다시 시작</span></button>
      <p><i></i> WASD / 방향키 / 마우스로 이동 · SPACE 점프 · 코인 수집</p>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
